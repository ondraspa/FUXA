<script><![CDATA[
//!export-start
var _pn_setState=0;
var _pb_boolState=false;
var _pn_setInterval=500;
var _pc_state0Colour='#808080';
var _pc_state1Colour='#22c55e';
var _pc_state2Colour='#eab308';
var _pc_state3Colour='#ef4444';
var _pc_state4Colour='#a855f7';
var _pc_state5Colour='#3b82f6';
var _pb_running=false;
var _pn_speed=100;
//!export-end
function postValue(id,v){console.log('FUXA post:',id,'=',v);}
function putValue(id,v){v=Number(v);switch(id){case '_pb_running':_pb_running=v!==0;break;case '_pn_speed':_pn_speed=v;break;
  case '_pn_setState':
    _pn_setState=v;
    var colors=[_pc_state0Colour,_pc_state1Colour,_pc_state2Colour,_pc_state3Colour,_pc_state4Colour,_pc_state5Colour];
    var c=colors[Math.min(v,5)]||'#808080';
    var els=document.querySelectorAll('#shape path,#shape circle,#shape rect');
    for(var k=0;k<els.length;k++){els[k].setAttribute('fill',c);}
    break;
  case '_pb_boolState':
    _pb_boolState=v!==0;
    var c2=_pb_boolState?_pc_state1Colour:_pc_state0Colour;
    var els2=document.querySelectorAll('#shape path,#shape circle,#shape rect');
    for(var j=0;j<els2.length;j++){els2[j].setAttribute('fill',c2);}
    break;
}}
var __ocBeltOffset = 0;
setInterval(function(){
  if(!_pb_running) return;
  var __ocBelt = document.querySelectorAll('.oc-belt');
  if(!__ocBelt.length) return;
  __ocBeltOffset = (__ocBeltOffset + _pn_speed * 0.02) % 7.429;
  var t = 'translate(' + (-__ocBeltOffset).toFixed(3) + ' 0)';
  for(var i=0;i<__ocBelt.length;i++){ __ocBelt[i].setAttribute('transform', t); }
}, 40);
var o=new MutationObserver(function(m){m.forEach(function(mu){mu.removedNodes.forEach(function(n){if(n.id==='fuxa-dyn-conveyor_20degincline'){o.disconnect();}});});});
o.observe(document.body,{childList:true,subtree:true});
]]></script>
