function putValue(id,v){v=Number(v);switch(id){
  case '_pn_setState':
    _pn_setState=v;
    var colors=[_pc_state0Colour,_pc_state1Colour,_pc_state2Colour,_pc_state3Colour,_pc_state4Colour,_pc_state5Colour];
