<svg id="fuxa-atex-diff-pressure-3d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#334155"/><stop offset="30%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="g-panel-glow" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="s3d"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#475569;stroke-width:2;rx:10;filter:url(#s3d)}
      .pg{fill:url(#g-panel-glow);rx:10}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:26px;fill:#38bdf8;font-weight:bold;filter:url(#glow)}
      .unit{font-family:sans-serif;font-size:13px;fill:#64748b}
      .badge{fill:url(#g-badge);stroke:#92400e;stroke-width:1.5}
      .alarm-on{fill:#ef4444;filter:url(#glow);animation:flash 0.8s infinite}
      .alarm-off{fill:#475569}
      .ok{fill:#22c55e;filter:url(#glow)}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.2}}
    </style>
  </defs>
  <linearGradient id="g-badge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="40%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
  <rect width="400" height="400" class="bg"/>
  <rect x="10" y="10" width="380" height="380" class="panel"/><rect x="10" y="10" width="380" height="380" class="pg"/>
  <rect x="18" y="18" width="364" height="32" rx="6" class="badge"/><rect x="18" y="18" width="364" height="16" rx="6" fill="#ffffff" opacity="0.15"/>
  <text x="26" y="38" font-family="sans-serif" font-size="9" fill="#1c1917" font-weight="bold">Ex II 2G</text>
  <text x="85" y="38" font-family="sans-serif" font-size="9" fill="#1c1917" font-weight="bold">DIFFERENTIAL PRESSURE</text>
  <text x="340" y="38" font-family="sans-serif" font-size="9" fill="#92400e" text-anchor="end">ATEX</text>
  <g transform="translate(200,170)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <circle cx="0" cy="0" r="80" fill="#0f172a" stroke="#475569" stroke-width="2.5" filter="url(#s3d)"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="280" stroke-dashoffset="150" id="dp-arc-3d" transform="rotate(-90)" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="-20" class="lbl" text-anchor="middle" fill="#38bdf8">dP</text>
    <text id="val-dp-3d" x="0" y="10" class="val" text-anchor="middle" font-size="28">25.4</text>
    <text x="0" y="30" class="unit" text-anchor="middle">Pa</text>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
  </g>
  <g transform="translate(25,285)">
    <rect width="165" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <rect width="165" height="14" rx="6" fill="#ffffff" opacity="0.05"/>
    <text x="12" y="22" class="lbl">RANGE / OUTPUT</text>
    <text x="82" y="44" class="unit" text-anchor="middle">0-100 Pa / 4-20 mA</text>
  </g>
  <g transform="translate(210,285)">
    <rect width="165" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <rect width="165" height="14" rx="6" fill="#ffffff" opacity="0.05"/>
    <text x="12" y="22" class="lbl">MEDIA</text>
    <text x="82" y="44" class="unit" text-anchor="middle">Air / Gases ATEX</text>
  </g>
  <g transform="translate(25,350)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <circle cx="22" cy="17" r="7" id="dp-status-3d" class="ok"/>
    <text x="40" y="22" class="lbl" fill="#94a3b8">STATUS: OK</text>
  </g>
  <g transform="translate(210,350)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <text x="82" y="22" class="lbl" text-anchor="middle" fill="#94a3b8">S/N: AT-DP-0037</text>
  </g>
  <script><![CDATA[
    var _pn_dp=25.4;var _pb_alarm=false;
    function postValue(id,v){console.log('FUXA post:',id,'=',v);}
    function putValue(id,v){
      v=Number(v);
      switch(id){
        case '_pn_dp':
          _pn_dp=v;document.getElementById('val-dp-3d').textContent=v.toFixed(1);
          var off=280-(v/100)*280;if(off<0)off=0;if(off>280)off=280;
          document.getElementById('dp-arc-3d').setAttribute('stroke-dashoffset',off);
          break;
        case '_pb_alarm':_pb_alarm=v!==0;
          document.getElementById('dp-status-3d').setAttribute('class',_pb_alarm?'alarm-on':'ok');break;
      }
    }
    var obs=new MutationObserver(function(m){m.forEach(function(mut){mut.removedNodes.forEach(function(n){if(n.id==='fuxa-atex-diff-pressure-3d'){obs.disconnect();}});});});
    obs.observe(document.body,{childList:true,subtree:true});
  ]]></script>
</svg>