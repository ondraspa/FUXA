<svg id="fuxa-atex-diff-pressure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="s"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#334155;stroke-width:1.5;rx:8;filter:url(#s)}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:24px;fill:#38bdf8;font-weight:bold}
      .unit{font-family:sans-serif;font-size:12px;fill:#64748b}
      .alarm-on{fill:#ef4444;animation:flash 1s infinite}
      .alarm-off{fill:#475569}
      .ok{fill:#22c55e}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
    </style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="panel"/>
  <rect x="20" y="20" width="360" height="30" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="30" y="40" class="lbl" fill="#fbbf24">ATEX ZONE 1 - DIFFERENTIAL PRESSURE</text>
  <g transform="translate(200,180)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="-20" class="lbl" text-anchor="middle" fill="#38bdf8">dP</text>
    <text id="val-dp" x="0" y="10" class="val" text-anchor="middle" font-size="26">25.4</text>
    <text x="0" y="30" class="unit" text-anchor="middle">Pa</text>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="260" stroke-dashoffset="150" transform="rotate(-90)" id="dp-arc"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
  </g>
  <g transform="translate(30,275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">RANGE</text>
    <text x="80" y="40" class="unit" text-anchor="middle">0 ... 100 Pa</text>
  </g>
  <g transform="translate(210,275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">OUTPUT</text>
    <text x="80" y="40" class="unit" text-anchor="middle">4-20 mA / 0-10V</text>
  </g>
  <g transform="translate(30,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" id="dp-status" class="ok"/>
    <text x="40" y="27" class="lbl" fill="#94a3b8">STATUS: OK</text>
  </g>
  <g transform="translate(210,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="22" class="lbl" text-anchor="middle">DIFFERENTIAL</text>
    <text class="unit" text-anchor="middle" x="80" y="38">PRESSURE SENSOR</text>
  </g>
  <script><![CDATA[
    var _pn_dp=25.4;var _pb_alarm=false;
    function postValue(id,v){console.log('FUXA post:',id,'=',v);}
    function putValue(id,v){
      v=Number(v);
      switch(id){
        case '_pn_dp':
          _pn_dp=v;document.getElementById('val-dp').textContent=v.toFixed(1);
          var off=260-(v/100)*260;if(off<0)off=0;if(off>260)off=260;
          document.getElementById('dp-arc').setAttribute('stroke-dashoffset',off);
          break;
        case '_pb_alarm':_pb_alarm=v!==0;document.getElementById('dp-status').setAttribute('class',_pb_alarm?'alarm-on':'ok');break;
      }
    }
    var obs=new MutationObserver(function(m){m.forEach(function(mut){mut.removedNodes.forEach(function(n){if(n.id==='fuxa-atex-diff-pressure'){obs.disconnect();}});});});
    obs.observe(document.body,{childList:true,subtree:true});
  ]]></script>
</svg>