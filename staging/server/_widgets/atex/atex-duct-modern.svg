<svg id="fuxa-atex-duct-modern" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="g-duct" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
    <filter id="s"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#334155;stroke-width:1.5;rx:8;filter:url(#s)}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:20px;fill:#38bdf8;font-weight:bold}
      .unit{font-family:sans-serif;font-size:12px;fill:#64748b}
      .duct{fill:url(#g-duct);stroke:#475569;stroke-width:2}
      .alarm-on{fill:#ef4444;animation:flash 1s infinite}
      .alarm-off{fill:#475569}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
      @keyframes flow{0%{stroke-dashoffset:24}to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="400" height="250" class="bg"/>
  <rect x="15" y="15" width="370" height="220" class="panel"/>
  <rect x="20" y="20" width="360" height="28" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="30" y="38" class="lbl" fill="#fbbf24">ATEX VENTILATION DUCT</text>
  <g transform="translate(200,130)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <rect x="-90" y="-40" width="180" height="80" rx="8" class="duct" filter="url(#s)"/>
    <rect x="-82" y="-32" width="164" height="64" rx="4" fill="#1e293b"/>
    <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" class="flow" id="duct-flow-1"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" class="flow" id="duct-flow-2"/>
    <line x1="-70" y1="20" x2="70" y2="20" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" class="flow" id="duct-flow-3"/>
    <rect x="-90" y="-45" width="180" height="10" rx="4" class="duct"/>
    <rect x="-90" y="35" width="180" height="10" rx="4" class="duct"/>
    <circle cx="82" cy="0" r="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <circle cx="-82" cy="0" r="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  </g>
  <g transform="translate(20,210)">
    <rect width="130" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="12" r="5" id="duct-status" class="alarm-off"/>
    <text x="30" y="17" class="lbl" fill="#94a3b8">FLOW: ACTIVE</text>
  </g>
  <g transform="translate(160,210)">
    <rect width="110" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" class="lbl" fill="#94a3b8">DIA: 250 mm</text>
  </g>
  <g transform="translate(280,210)">
    <rect width="95" height="25" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" class="lbl" fill="#94a3b8">VEL: 8.2 m/s</text>
  </g>
  <script><![CDATA[
    var _pb_flowActive=true;var _pn_velocity=8.2;
    function postValue(id,v){console.log('FUXA post:',id,'=',v);}
    function putValue(id,v){
      switch(id){
        case '_pb_flowActive':
          _pb_flowActive=v!==0;
          var lines=document.querySelectorAll('.flow');
          lines.forEach(function(l){l.style.animation=_pb_flowActive?'flow 1s linear infinite':'none';l.style.opacity=_pb_flowActive?'1':'0.1';});
          var st=document.getElementById('duct-status');
          st.setAttribute('class',_pb_flowActive?'alarm-off':'alarm-on');
          break;
        case '_pn_velocity':_pn_velocity=Number(v);break;
      }
    }
    var obs=new MutationObserver(function(m){m.forEach(function(mut){mut.removedNodes.forEach(function(n){if(n.id==='fuxa-atex-duct-modern'){obs.disconnect();}});});});
    obs.observe(document.body,{childList:true,subtree:true});
  ]]></script>
</svg>