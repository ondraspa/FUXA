<svg id="fuxa-atex-filter-stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="g-filter" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="s"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#334155;stroke-width:1.5;rx:8;filter:url(#s)}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:22px;fill:#10b981;font-weight:bold}
      .unit{font-family:sans-serif;font-size:12px;fill:#64748b}
      .filter-body{fill:url(#g-filter);stroke:#047857;stroke-width:2;rx:4}
      .alarm-on{fill:#ef4444;animation:flash 1s infinite}
      .alarm-off{fill:#475569}
      .ok{fill:#22c55e}
      .warn{fill:#f59e0b}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
      @keyframes airflow{0%{opacity:0.3}50%{opacity:0.8}100%{opacity:0.3}}
    </style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="panel"/>
  <rect x="20" y="20" width="360" height="30" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="30" y="40" class="lbl" fill="#fbbf24">ATEX ZONE 1 - FILTER STAGE</text>
  <g transform="translate(200,175)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <rect x="-70" y="-70" width="140" height="140" rx="10" class="filter-body"/>
    <rect x="-55" y="-55" width="110" height="110" rx="6" fill="#0f172a" opacity="0.5"/>
    <path d="M-40,-40 L40,-40 L20,0 L40,40 L-40,40 L-20,0 Z" fill="#10b981" opacity="0.3" stroke="#34d399" stroke-width="1.5"/>
    <path d="M-30,-30 L30,-30 L15,0 L30,30 L-30,30 L-15,0 Z" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="0" cy="0" r="15" fill="#10b981" opacity="0.4" id="filter-pulse"/>
    <text x="0" y="4" class="lbl" text-anchor="middle" fill="#34d399">HEPA</text>
  </g>
  <g transform="translate(30,270)">
    <rect width="160" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">EFFICIENCY</text>
    <text id="val-eff" x="80" y="42" class="val" text-anchor="middle" font-size="20">99.97</text>
    <text x="135" y="42" class="unit">%</text>
  </g>
  <g transform="translate(210,270)">
    <rect width="160" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">DIFFERENTIAL P</text>
    <text id="val-fdp" x="80" y="42" class="val" text-anchor="middle" font-size="20" fill="#38bdf8">125</text>
    <text x="125" y="42" class="unit">Pa</text>
  </g>
  <g transform="translate(30,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="18" class="lbl">FILTER LIFE</text>
    <text x="80" y="36" class="unit" text-anchor="middle">82 % remaining</text>
  </g>
  <g transform="translate(210,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" id="filter-status" class="ok"/>
    <text x="40" y="27" class="lbl" fill="#94a3b8">OPERATIONAL</text>
  </g>
  <script><![CDATA[
    var _pn_efficiency=99.97;var _pn_dp=125;var _pb_clogged=false;
    function postValue(id,v){console.log('FUXA post:',id,'=',v);}
    function putValue(id,v){
      v=Number(v);
      switch(id){
        case '_pn_efficiency':_pn_efficiency=v;document.getElementById('val-eff').textContent=v.toFixed(2);break;
        case '_pn_dp':_pn_dp=v;document.getElementById('val-fdp').textContent=Math.round(v);break;
        case '_pb_clogged':
          _pb_clogged=v!==0;
          var st=document.getElementById('filter-status');
          st.setAttribute('class',_pb_clogged?'alarm-on':'ok');
          break;
      }
    }
    var obs=new MutationObserver(function(m){m.forEach(function(mut){mut.removedNodes.forEach(function(n){if(n.id==='fuxa-atex-filter-stage'){obs.disconnect();}});});});
    obs.observe(document.body,{childList:true,subtree:true});
  ]]></script>
</svg>