<svg id="fuxa-atex-humidity-sensor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#334155;stroke-width:1.5;rx:8;filter:url(#s)}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:24px;fill:#38bdf8;font-weight:bold}
      .unit{font-family:sans-serif;font-size:12px;fill:#64748b}
      .atex-tag{font-family:sans-serif;font-size:9px;fill:#fbbf24;font-weight:bold}
      .alarm-on{fill:#ef4444;animation:flash 1s infinite}
      .alarm-off{fill:#475569}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
      @keyframes wave{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
    </style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="panel"/>
  <rect x="20" y="20" width="360" height="30" rx="4" fill="#f59e0b" opacity="0.15"/>
  <rect x="25" y="24" width="14" height="22" rx="3" fill="#f59e0b"/>
  <text x="45" y="40" class="atex-tag" fill="#fbbf24">ATEX ZONE 1 - HUMIDITY</text>
  <text x="330" y="40" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">RH</text>
  <g transform="translate(200, 170)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <rect x="-60" y="-75" width="120" height="150" rx="60" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="-45" y="-60" width="90" height="120" rx="45" fill="url(#g-water)" opacity="0.3"/>
    <rect x="-35" y="-50" width="70" height="100" rx="35" fill="url(#g-water)" opacity="0.5" id="water-level"/>
    <rect x="-25" y="-40" width="50" height="80" rx="25" fill="url(#g-water)" opacity="0.7"/>
    <text x="0" y="8" class="val" text-anchor="middle" font-size="28" fill="#38bdf8" id="val-hum">68.4</text>
    <text x="0" y="30" class="unit" text-anchor="middle" fill="#38bdf8">% RH</text>
  </g>
  <g transform="translate(30, 275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">MEASURING RANGE</text>
    <text x="80" y="40" class="unit" text-anchor="middle">0 ... 100 % RH</text>
  </g>
  <g transform="translate(210, 275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">ACCURACY</text>
    <text x="80" y="40" class="unit" text-anchor="middle">± 1.5 % RH</text>
  </g>
  <g transform="translate(30, 340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="18" class="lbl">DEW POINT</text>
    <text id="val-dew" x="80" y="38" class="val" text-anchor="middle" font-size="16" fill="#38bdf8">12.3</text>
    <text x="120" y="38" class="unit">°C</text>
  </g>
  <g transform="translate(210, 340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="22" r="6" id="status-hum" class="alarm-off"/>
    <text x="45" y="27" class="lbl" fill="#94a3b8">STATUS</text>
  </g>
  <script><![CDATA[
    var _pn_humidity = 68.4;
    var _pn_dewpoint = 12.3;
    var _pb_alarm = false;
    function postValue(id, v) { console.log('FUXA post:', id, '=', v); }
    function putValue(id, v) {
      v = Number(v);
      switch(id) {
        case '_pn_humidity':
          _pn_humidity = Math.max(0, Math.min(100, v));
          document.getElementById('val-hum').textContent = _pn_humidity.toFixed(1);
          var h = (100 - _pn_humidity) * 0.8;
          document.getElementById('water-level').setAttribute('y', -50 + h);
          document.getElementById('water-level').setAttribute('height', 100 - h);
          break;
        case '_pn_dewpoint':
          _pn_dewpoint = v;
          document.getElementById('val-dew').textContent = v.toFixed(1);
          break;
        case '_pb_alarm':
          _pb_alarm = v !== 0;
          var s = document.getElementById('status-hum');
          s.setAttribute('class', _pb_alarm ? 'alarm-on' : 'alarm-off');
          break;
      }
    }
    var obs = new MutationObserver(function(m) {
      m.forEach(function(mut) { mut.removedNodes.forEach(function(n) { if(n.id === 'fuxa-atex-humidity-sensor') { obs.disconnect(); }}); });
    });
    obs.observe(document.body, {childList:true,subtree:true});
  ]]></script>
</svg>