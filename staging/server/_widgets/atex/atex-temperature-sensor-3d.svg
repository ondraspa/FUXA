<svg id="fuxa-atex-temp-sensor-3d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/><stop offset="50%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="30%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g-panel-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="25%" stop-color="#e2e8f0"/><stop offset="75%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="g-atex-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="40%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="g-gauge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="80%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="s3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#475569;stroke-width:2;rx:10;filter:url(#s3d)}
      .panel-glow{fill:url(#g-panel-glow);rx:10}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:26px;fill:#10b981;font-weight:bold;filter:url(#glow)}
      .unit{font-family:sans-serif;font-size:13px;fill:#64748b}
      .atex-tag{font-family:sans-serif;font-size:9px;fill:#1c1917;font-weight:bold}
      .atex-badge{fill:url(#g-atex-3d);stroke:#92400e;stroke-width:1.5}
      .alarm-on{fill:#ef4444;filter:url(#glow);animation:flash 0.8s infinite}
      .alarm-off{fill:#475569}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.2}}
      .metal{fill:url(#g-metal);stroke:#475569;stroke-width:1.5}
    </style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="10" y="10" width="380" height="380" class="panel"/>
  <rect x="10" y="10" width="380" height="380" class="panel-glow"/>
  <rect x="18" y="18" width="364" height="32" rx="6" class="atex-badge"/>
  <rect x="18" y="18" width="364" height="16" rx="6" fill="#ffffff" opacity="0.15"/>
  <rect x="26" y="24" width="18" height="20" rx="3" fill="#1c1917"/>
  <text x="30" y="38" class="atex-tag" fill="#1c1917">Ex</text>
  <text x="52" y="38" class="atex-tag" fill="#1c1917" font-size="8">II 2G Ex ib IIC T4</text>
  <text x="340" y="38" font-family="sans-serif" font-size="9" fill="#92400e" text-anchor="end">IECEx / ATEX</text>
  <g transform="translate(200, 175)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <circle cx="0" cy="0" r="80" fill="url(#g-gauge)" stroke="#475569" stroke-width="2.5" filter="url(#s3d)"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="280" stroke-dashoffset="70" id="temp-arc-3d" transform="rotate(-90)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="14" fill="#10b981" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#10b981" stroke-width="4" stroke-linecap="round" id="temp-needle-3d" transform="rotate(-45)" filter="url(#glow)"/>
    <text x="0" y="10" class="val" text-anchor="middle" font-size="30" id="val-temp-3d">42.6</text>
    <text x="0" y="30" class="unit" text-anchor="middle">°C</text>
  </g>
  <g transform="translate(25, 285)">
    <rect width="165" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <rect width="165" height="14" rx="6" fill="#ffffff" opacity="0.05"/>
    <text x="12" y="22" class="lbl">MEASURING RANGE</text>
    <text x="82" y="44" class="unit" text-anchor="middle">-20 ... +80 °C</text>
  </g>
  <g transform="translate(210, 285)">
    <rect width="165" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <rect width="165" height="14" rx="6" fill="#ffffff" opacity="0.05"/>
    <text x="12" y="22" class="lbl">OUTPUT</text>
    <text x="82" y="44" class="unit" text-anchor="middle">4-20 mA / HART</text>
  </g>
  <g transform="translate(25, 350)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <rect width="165" height="35" rx="6" fill="#ffffff" opacity="0.03"/>
    <circle cx="22" cy="17" r="7" id="status-temp-3d" class="alarm-on"/>
    <text x="40" y="22" class="lbl" fill="#94a3b8">STATUS: NOMINAL</text>
  </g>
  <g transform="translate(210, 350)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s3d)"/>
    <text x="82" y="22" class="unit" text-anchor="middle">S/N: AT-TS-0422-3D</text>
  </g>
  <script><![CDATA[
    var _pn_temp = 42.6;
    var _pb_alarm = false;
    function postValue(id, v) { console.log('FUXA post:', id, '=', v); }
    function putValue(id, v) {
      v = Number(v);
      switch(id) {
        case '_pn_temp':
          _pn_temp = v;
          document.getElementById('val-temp-3d').textContent = v.toFixed(1);
          var angle = ((v + 20) / 100) * 180 - 90;
          if (angle < -90) angle = -90; if (angle > 90) angle = 90;
          document.getElementById('temp-needle-3d').setAttribute('transform', 'rotate(' + angle + ')');
          break;
        case '_pb_alarm':
          _pb_alarm = v !== 0;
          var s = document.getElementById('status-temp-3d');
          s.setAttribute('class', _pb_alarm ? 'alarm-on' : 'alarm-off');
          break;
      }
    }
    var af;
    function animate() {
      document.getElementById('temp-arc-3d').setAttribute('stroke-dashoffset', 70 - (_pn_temp / 80) * 140);
      af = requestAnimationFrame(animate);
    }
    af = requestAnimationFrame(animate);
    var obs = new MutationObserver(function(m) {
      m.forEach(function(mut) { mut.removedNodes.forEach(function(n) { if(n.id === 'fuxa-atex-temp-sensor-3d') { cancelAnimationFrame(af); obs.disconnect(); }}); });
    });
    obs.observe(document.body, {childList:true,subtree:true});
  ]]></script>
</svg>