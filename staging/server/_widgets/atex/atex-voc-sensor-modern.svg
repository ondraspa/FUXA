<svg id="fuxa-atex-voc-sensor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/></linearGradient>
    <linearGradient id="g-panel" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="s"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/></filter>
    <style>
      .bg{fill:url(#g-bg)}.panel{fill:url(#g-panel);stroke:#334155;stroke-width:1.5;rx:8;filter:url(#s)}
      .lbl{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#94a3b8;font-weight:600;letter-spacing:1px}
      .val{font-family:Consolas,monospace;font-size:24px;fill:#f59e0b;font-weight:bold}
      .unit{font-family:sans-serif;font-size:12px;fill:#64748b}
      .atex-tag{font-family:sans-serif;font-size:9px;fill:#1c1917;font-weight:bold}
      .badge{fill:#f59e0b;stroke:#b45309;stroke-width:1}
      .alarm-on{fill:#ef4444;animation:flash 1s infinite}
      .alarm-off{fill:#475569}
      .ok{fill:#22c55e}
      .warn{fill:#f59e0b}
      @keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
      @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
    </style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="panel"/>
  <rect x="20" y="20" width="360" height="30" rx="4" fill="#f59e0b" opacity="0.15"/>
  <rect x="24" y="24" width="18" height="22" rx="3" class="badge"/>
  <text x="30" y="38" class="atex-tag">Ex</text>
  <text x="52" y="38" class="atex-tag" fill="#1c1917" font-size="8">II 2G Ex ib IIC T4</text>
  <text x="340" y="38" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">VOC SENSOR</text>
  <g transform="translate(200,170)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="-15" class="lbl" text-anchor="middle" fill="#f59e0b">VOC</text>
    <text id="val-voc" x="0" y="12" class="val" text-anchor="middle" font-size="28">0.8</text>
    <text x="0" y="32" class="unit" text-anchor="middle">ppm</text>
    <rect x="-50" y="45" width="100" height="12" rx="6" fill="#334155"/>
    <rect id="voc-bar" x="-50" y="45" width="30" height="12" rx="6" fill="#f59e0b"/>
  </g>
  <g transform="translate(30,275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">MEASURING RANGE</text>
    <text x="80" y="40" class="unit" text-anchor="middle">0 ... 100 % LEL</text>
  </g>
  <g transform="translate(210,275)">
    <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="20" class="lbl">GAS TYPE</text>
    <text x="80" y="40" class="unit" text-anchor="middle">Solvent / VOC</text>
  </g>
  <g transform="translate(30,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" id="voc-status" class="ok"/>
    <text x="40" y="27" class="lbl" fill="#94a3b8">LEVEL: NORMAL</text>
  </g>
  <g transform="translate(210,340)">
    <rect width="160" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="80" y="22" class="lbl" text-anchor="middle" fill="#94a3b8">ALARM THRESHOLD</text>
    <text class="unit" text-anchor="middle" x="80" y="38">2.0 ppm</text>
  </g>
  <script><![CDATA[
    var _pn_voc = 0.8;
    var _pb_alarm = false;
    function postValue(id,v){console.log('FUXA post:',id,'=',v);}
    function putValue(id,v){
      v=Number(v);
      switch(id){
        case '_pn_voc':
          _pn_voc=v;
          document.getElementById('val-voc').textContent=v.toFixed(1);
          var pct=Math.min(100,Math.max(0,(v/5)*100));
          document.getElementById('voc-bar').setAttribute('width',pct*0.8);
          var st=document.getElementById('voc-status');
          if(v>2){st.setAttribute('class','alarm-on');}else if(v>1){st.setAttribute('class','warn');}else{st.setAttribute('class','ok');}
          break;
        case '_pb_alarm':_pb_alarm=v!==0;break;
      }
    }
    var obs=new MutationObserver(function(m){m.forEach(function(mut){mut.removedNodes.forEach(function(n){if(n.id==='fuxa-atex-voc-sensor'){obs.disconnect();}});});});
    obs.observe(document.body,{childList:true,subtree:true});
  ]]></script>
</svg>