<svg id="fuxa-flow-meter" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Industrial 3D Gradients -->
    <linearGradient id="meter-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="flow-liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <style>
      .meter-main { fill: url(#meter-body); stroke: #475569; stroke-width: 2.5; }
      .pipe { fill: none; stroke: url(#pipe-steel); stroke-width: 18; }
      
      .flow-line {
        fill: none;
        stroke-width: 8;
        stroke-dasharray: 16 16;
        animation: flow-anim 0.8s linear infinite;
      }
      .flow-blue { stroke: url(#flow-liquid); opacity: 0.8; }
      
      @keyframes flow-anim {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }

      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 20px; fill: #10b981; font-weight: bold; }
      .hmi-unit { font-family: sans-serif; font-size: 13px; fill: #64748b; }
      .hmi-setpoint { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
      
      .indicator-on { fill: #22c55e; filter: url(#glow-green); }
      .indicator-off { fill: #475569; }
      
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f1f5f9" />

  <!-- Pipes -->
  <g id="pipes">
    <path d="M40 250 L130 250" class="pipe" filter="url(#shadow-3d)" />
    <path d="M270 250 L360 250" class="pipe" filter="url(#shadow-3d)" />
    <path d="M40 250 L130 250" class="flow-line flow-blue" id="flow-inlet" opacity="0.8" />
    <path d="M270 250 L360 250" class="flow-line flow-blue" id="flow-outlet" opacity="0.8" />
  </g>

  <!-- Flow Meter Body -->
  <g id="flow-meter-group" filter="url(#shadow-3d)">
    <!-- Main housing -->
    <rect x="140" y="180" width="120" height="140" rx="15" class="meter-main" />
    
    <!-- Display window -->
    <rect x="155" y="200" width="90" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Digital display -->
    <text id="flow_display" x="200" y="235" font-family="monospace" font-size="24" fill="#10b981" text-anchor="middle" font-weight="bold">125.4</text>
    <text x="200" y="255" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">L/min</text>
    
    <!-- Totalizer -->
    <rect x="155" y="270" width="90" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text id="total_display" x="200" y="296" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle">12,450.0</text>
    
    <!-- Flow direction arrow -->
    <g transform="translate(200, 340)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
      <path d="M-25 0 L25 0 M15 -10 L25 0 L15 10" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Process Connection -->
  <g id="process-connection">
    <rect x="130" y="185" width="20" height="130" rx="4" class="meter-main" />
    <rect x="250" y="185" width="20" height="130" rx="4" class="meter-main" />
  </g>

  <!-- HMI Panels -->
  <g id="hmi-panels">
    <!-- Instant Flow Panel -->
    <g transform="translate(20, 30)">
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">INSTANT FLOW</text>
      <text id="val_flow" x="90" y="75" class="hmi-value" text-anchor="middle">125.4</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">L/min</text>
    </g>

    <!-- Total Flow Panel -->
    <g transform="translate(20, 140)">
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">TOTAL FLOW</text>
      <text id="val_total" x="90" y="75" class="hmi-value" text-anchor="middle">12,450</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">L</text>
    </g>

    <!-- Status Panel -->
    <g transform="translate(20, 250)">
      <rect width="180" height="90" class="hmi-panel" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">FLOW STATUS</text>
      <circle id="status_light" cx="90" cy="65" r="14" class="indicator-on" />
    </g>

    <!-- Setpoint Panel -->
    <g transform="translate(20, 360)" class="interactive">
      <rect width="180" height="90" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">FLOW SETPOINT</text>
      <rect x="30" y="50" width="120" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text id="set_flow" x="90" y="76" class="hmi-setpoint" text-anchor="middle">120.0</text>
    </g>

    <!-- Alarm Panel -->
    <g transform="translate(240, 30)" class="interactive">
      <rect width="140" height="250" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="70" y="35" class="hmi-label" text-anchor="middle">ALARM SETPOINTS</text>
      
      <rect x="20" y="60" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="82" class="hmi-label" text-anchor="middle">HIGH ALARM</text>
      <text id="alarm_high" x="70" y="105" class="hmi-setpoint" text-anchor="middle">150.0</text>
      
      <rect x="20" y="125" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="147" class="hmi-label" text-anchor="middle">LOW ALARM</text>
      <text id="alarm_low" x="70" y="170" class="hmi-setpoint" text-anchor="middle">50.0</text>
      
      <rect x="20" y="195" width="100" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
      <text x="70" y="221" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">RESET ALARMS</text>
    </g>
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_flowRate = 125.4;
    var _pn_totalFlow = 12450.0;
    var _pb_flowActive = true;
    var _pn_setFlow = 120.0;
    var _pn_alarmHigh = 150.0;
    var _pn_alarmLow = 50.0;
    //!export-end

    function postValue(id, value) {
      console.log('FUXA post:', id, '=', value);
    }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_flowRate':
          _pn_flowRate = v;
          document.getElementById('flow_display').textContent = v.toFixed(1);
          document.getElementById('val_flow').textContent = v.toFixed(1);
          break;
        case '_pn_totalFlow':
          _pn_valveOpen = v;
          document.getElementById('total_display').textContent = Math.round(v).toLocaleString();
          document.getElementById('val_total').textContent = Math.round(v).toLocaleString();
          break;
        case '_pb_flowActive':
          _pn_valveOpen = (v !== 0);
          var light = document.getElementById('status_light');
          if (_pn_valveOpen) {
            light.setAttribute('class', 'indicator-on');
          } else {
            light.setAttribute('class', 'indicator-off');
          }
          break;
        case '_pn_setFlow':
          _pn_valveOpen = v;
          document.getElementById('set_flow').textContent = v.toFixed(1);
          break;
        case '_pn_alarmHigh':
          _pn_valveOpen = v;
          document.getElementById('alarm_high').textContent = v.toFixed(1);
          break;
        case '_pn_alarmLow':
          _pn_valveOpen = v;
          document.getElementById('alarm_low').textContent = v.toFixed(1);
          break;
      }
    }

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.removedNodes.forEach(function(node) {
          if (node.id === 'fuxa-flow-meter') observer.disconnect();
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>
