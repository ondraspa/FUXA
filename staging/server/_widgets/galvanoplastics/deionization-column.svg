<svg id="fuxa-deion" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="di-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="di-tank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="di-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="di-shadow"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/></filter>
    <style>.bg{fill:url(#di-bg)}.tank{fill:url(#di-tank);stroke:#475569;stroke-width:2;rx:8;filter:url(#di-shadow)}.metal{fill:url(#di-metal);stroke:#475569;stroke-width:1.5}.lbl{font:600 10px/1 'Segoe UI',sans-serif;fill:#94a3b8}.val{font:bold 18px/1 Consolas,monospace;fill:#10b981}.unit{font:11px/1 sans-serif;fill:#64748b}</style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="tank"/>
  <g transform="translate(200,170)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/>
    <circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <!-- Column body -->
    <rect x="-30" y="-70" width="60" height="140" rx="6" class="metal" filter="url(#di-shadow)"/>
    <rect x="-25" y="-65" width="50" height="130" rx="4" fill="#1e293b"/>
    <!-- View window -->
    <rect x="-20" y="-50" width="40" height="100" rx="3" fill="#0f172a" stroke="#334155"/>
    <rect id="di-level" x="-18" y="50" width="36" height="0" rx="2" fill="#7dd3fc" opacity="0.6"/>
    <!-- Pump (Flojet) -->
    <rect x="-50" y="50" width="100" height="40" rx="4" class="metal"/>
    <circle cx="0" cy="70" r="12" fill="#334155" stroke="#475569"/>
    <circle cx="0" cy="70" r="6" fill="#10b981"/>
    <!-- Pipes -->
    <rect x="-100" y="-10" width="70" height="6" rx="3" class="metal"/>
    <rect x="30" y="-10" width="70" height="6" rx="3" class="metal"/>
    <!-- Labels -->
    <text x="0" y="95" class="lbl" text-anchor="middle">DEIONIZATION COLUMN</text>
    <text x="0" y="108" class="unit" text-anchor="middle">Flojet Diaphragm Pump</text>
  </g>
  <g transform="translate(25,340)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="17" r="6" id="di-status" class="alarm-on"/>
    <text x="40" y="22" class="lbl" fill="#94a3b8">STATUS: NOMINAL</text>
  </g>
  <g transform="translate(210,340)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="82" y="22" class="unit" text-anchor="middle">230V 16A</text>
  </g>
  <script><![CDATA[
    var _pn_flowRate = 50;
    var _pb_running = true;
    function postValue(id, v) { console.log('FUXA post:', id, '=', v); }
    function putValue(id, v) {
      v = Number(v);
      switch(id) {
        case '_pn_flowRate':
          _pn_flowRate = Math.max(0, Math.min(100, v));
          var h = (_pn_flowRate / 100) * 100;
          document.getElementById('di-level').setAttribute('height', h);
          document.getElementById('di-level').setAttribute('y', 50 - h);
          break;
        case '_pb_running':
          _pb_running = v !== 0;
          document.getElementById('di-status').setAttribute('class', _pb_running ? 'alarm-on' : 'alarm-off');
          break;
      }
    }
    var obs = new MutationObserver(function(m) {
      m.forEach(function(mu) { mu.removedNodes.forEach(function(n) { if(n.id==='fuxa-deion') obs.disconnect(); }); });
    });
    obs.observe(document.body, {childList:true,subtree:true});
  ]]></script>
</svg>
echo "Created deionization-column.svg"