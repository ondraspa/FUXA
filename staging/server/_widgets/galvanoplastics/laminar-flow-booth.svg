<svg id="fuxa-laminar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lf-tank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="lf-shadow"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/></filter>
    <style>.bg{fill:url(#lf-bg)}.tank{fill:url(#lf-tank);stroke:#475569;stroke-width:2;rx:8;filter:url(#lf-shadow)}.metal{fill:#e2e8f0;stroke:#475569;stroke-width:1.5}.air{fill:#7dd3fc;opacity:0.3}.lbl{font:600 10px/1 'Segoe UI',sans-serif;fill:#94a3b8}.unit{font:11px/1 sans-serif;fill:#64748b}</style>
  </defs>
  <rect width="400" height="400" class="bg"/>
  <rect x="15" y="15" width="370" height="370" class="tank"/>
  <g transform="translate(200,160)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/>
    <circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
    <!-- Booth body -->
    <rect x="-70" y="-60" width="140" height="120" rx="6" class="metal" filter="url(#lf-shadow)"/>
    <rect x="-65" y="-55" width="130" height="110" rx="4" fill="#1e293b"/>
    <!-- View window -->
    <rect x="-55" y="-45" width="110" height="80" rx="3" fill="#0f172a" stroke="#334155"/>
    <!-- Air flow lines -->
    <line x1="-45" y1="-35" x2="45" y2="-35" class="air" stroke-width="2" stroke-dasharray="4 4" id="lf-air1"/>
    <line x1="-45" y1="-20" x2="45" y2="-20" class="air" stroke-width="2" stroke-dasharray="4 4" id="lf-air2"/>
    <line x1="-45" y1="-5" x2="45" y2="-5" class="air" stroke-width="2" stroke-dasharray="4 4" id="lf-air3"/>
    <!-- Platter -->
    <circle cx="0" cy="20" r="25" fill="#334155" stroke="#475569"/>
    <circle cx="0" cy="20" r="18" fill="#1e293b"/>
    <!-- Footswitch connection -->
    <rect x="-30" y="55" width="60" height="15" rx="3" fill="#334155" stroke="#475569"/>
    <text x="0" y="65" class="unit" text-anchor="middle" fill="#94a3b8">FOOTSW</text>
    <!-- Labels -->
    <text x="0" y="85" class="lbl" text-anchor="middle">LAMINAR FLOW BOOTH</text>
    <text x="0" y="98" class="unit" text-anchor="middle">Alpha/Toolex PPB — Absolute Air Filtration</text>
  </g>
  <g transform="translate(25,340)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="17" r="6" id="lf-status" class="alarm-on"/>
    <text x="40" y="22" class="lbl" fill="#94a3b8">STATUS: FLOWING</text>
  </g>
  <g transform="translate(210,340)">
    <rect width="165" height="35" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="82" y="22" class="unit" text-anchor="middle">230V 16A</text>
  </g>
  <script><![CDATA[
    var _pb_fanRunning = true;
    function postValue(id, v) { console.log('FUXA post:', id, '=', v); }
    function putValue(id, v) {
      v = Number(v);
      switch(id) {
        case '_pb_fanRunning':
          _pb_fanRunning = v !== 0;
          var opacity = _pb_fanRunning ? 0.5 : 0.1;
          document.getElementById('lf-air1').setAttribute('opacity', opacity);
          document.getElementById('lf-air2').setAttribute('opacity', opacity);
          document.getElementById('lf-air3').setAttribute('opacity', opacity);
          document.getElementById('lf-status').setAttribute('class', _pb_fanRunning ? 'alarm-on' : 'alarm-off');
          break;
      }
    }
    var obs = new MutationObserver(function(m) {
      m.forEach(function(mu) { mu.removedNodes.forEach(function(n) { if(n.id==='fuxa-laminar') obs.disconnect(); }); });
    });
    obs.observe(document.body, {childList:true,subtree:true});
  ]]></script>
</svg>
echo "Created laminar-flow-booth.svg"