<svg id="fuxa-boiler" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%"><defs>
<linearGradient id="gs" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="30%" stop-color="#cbd5e1"/><stop offset="70%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
<linearGradient id="gi" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="50%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/></linearGradient>
<linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="40%" stop-color="#dc2626"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
<linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="40%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
<filter id="s"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/></filter>
<style>.b{fill:#dbeafe}.f{fill:url(#gs);stroke:#475569;stroke-width:1.5;rx:12;filter:url(#s)}.st{fill:url(#gs);stroke:#475569;stroke-width:1.5}.ir{fill:url(#gi);stroke:#334155;stroke-width:1.5}.cp{fill:url(#gc);stroke:#7f1d1d;stroke-width:1.5}.bl{fill:url(#gb);stroke:#075985;stroke-width:1.5}.tg{font:9px/1 sans-serif;fill:#64748b;text-anchor:middle;font-weight:600;letter-spacing:0.5px}
@keyframes ff{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}@keyframes fa{0%,100%{opacity:1}50%{opacity:0.2}}@keyframes fr{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fl{animation:ff .8s linear infinite}.fl2{animation:ff .6s linear infinite}.ala{animation:fa 1s infinite}.rot{animation:fr 3s linear infinite}
</style></defs><rect width="400" height="400" class="b"/><rect x="12" y="12" width="376" height="376" class="f"/><g transform="translate(200,175)"><circle class="cp" cx="0" cy="-85" r="0" data-port-id="steam" data-port-dir="top" data-port-type="pipe"/><rect x="-75" y="-75" width="150" height="150" rx="8" class="st" filter="url(#s)"/><rect x="-68" y="-68" width="136" height="136" rx="35" fill="#1e293b" stroke="#334155"/><ellipse cx="0" cy="25" rx="50" ry="40" fill="#0f172a" stroke="#475569"/><circle cx="0" cy="-10" r="42" fill="#0f172a" stroke="#475569"/><path d="M-18,-30 Q0,-60 18,-30 Q8,-15 0,-10 Q-8,-15 -18,-30" fill="#f97316" opacity="0.8" id="boiler-fire"/><circle cx="0" cy="-10" r="6" fill="#fb923c" class="ala"/><rect x="-30" y="45" width="60" height="14" rx="4" class="ir"/><line x1="-80" y1="0" x2="-68" y2="0" class="cp" stroke-width="5"/><line x1="68" y1="0" x2="80" y2="0" class="cp" stroke-width="5"/><circle cx="-82" cy="0" r="7" class="cp"/><circle cx="82" cy="0" r="7" class="cp"/><text x="0" y="85" class="tg">INDUSTRIAL BOILER</text></g><script><![CDATA[//!export-start
var _pn_temp=185;var _pn_pressure=10.5;var _pb_fire=true;
//!export-end
function postValue(id,v){console.log('FUXA post:',id,'=',v);}
function putValue(id,v){v=Number(v);switch(id){case "_pn_temp":break;case "_pn_pressure":break;}}

var o=new MutationObserver(function(m){m.forEach(function(mu){mu.removedNodes.forEach(function(n){if(n.id==='fuxa-boiler'){o.disconnect();}});});});o.observe(document.body,{childList:true,subtree:true});
]]></script></svg>