<svg id="fuxa-industrial-valve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Industrial 3D Gradients -->
    <linearGradient id="valve-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="valve-handle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="30%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="valve-handle-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <linearGradient id="pipe-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      .valve-main { fill: url(#valve-body); stroke: #475569; stroke-width: 2.5; }
      .valve-handle { fill: url(#valve-handle-red); stroke: #7f1d1d; stroke-width: 2; }
      .pipe { fill: none; stroke: url(#pipe-steel); stroke-width: 20; }
      
      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 18px; fill: #10b981; font-weight: bold; }
      .hmi-setpoint { font-family: monospace; font-size: 13px; fill: #38bdf8; font-weight: bold; }
      
      .indicator-on { fill: #22c55e; filter: url(#glow-green); }
      .indicator-off { fill: #475569; }
      
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f1f5f9" />

  <!-- Pipes -->
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
  <g id="pipes">
    <path d="M40 150 L130 150" class="pipe" filter="url(#shadow-3d)" />
    <path d="M270 150 L360 150" class="pipe" filter="url(#shadow-3d)" />
  </g>

  <!-- Valve Body -->
  <g id="valve-body-group" filter="url(#shadow-3d)">
    <!-- Main body -->
    <path d="M140 95 L260 95 Q270 95 270 105 L270 195 Q270 205 260 205 L140 205 Q130 205 130 195 L130 105 Q130 95 140 95 Z" class="valve-main" />
    
    <!-- Internal flow path -->
    <rect x="150" y="135" width="100" height="30" fill="#475569" rx="4" />
    
    <!-- Gate/Plug -->
    <rect id="valve_gate" x="155" y="140" width="90" height="20" rx="3" fill="#64748b" stroke="#475569" stroke-width="1.5" />
    
    <!-- Flanges -->
    <rect x="120" y="95" width="20" height="110" rx="3" class="valve-main" />
    <rect x="260" y="95" width="20" height="110" rx="3" class="valve-main" />
    
    <!-- Flange bolts -->
    <circle cx="125" cy="108" r="4" fill="#475569" stroke="#334155" />
    <circle cx="125" cy="192" r="4" fill="#475569" stroke="#334155" />
    <circle cx="275" cy="108" r="4" fill="#475569" stroke="#334155" />
    <circle cx="275" cy="192" r="4" fill="#475569" stroke="#334155" />
  </g>

  <!-- Actuator/Handwheel -->
  <g id="valve-actuator">
    <!-- Stem -->
    <rect x="190" y="55" width="20" height="40" class="valve-main" rx="3" />
    
    <!-- Handwheel -->
    <g id="handwheel">
      <circle cx="200" cy="35" r="28" class="valve-handle" />
      <circle cx="200" cy="35" r="18" fill="#991b1c" stroke="#7f1d1d" stroke-width="2" />
      <circle cx="200" cy="35" r="8" fill="#475569" stroke="#334155" stroke-width="2" />
      <!-- Wheel spokes -->
      <line x1="180" y1="35" x2="220" y2="35" stroke="#7f1d1d" stroke-width="4" />
      <line x1="200" y1="15" x2="200" y2="55" stroke="#7f1d1d" stroke-width="4" />
    </g>
  </g>

  <!-- Position Indicator -->
  <g id="position-indicator" transform="translate(30, 30)">
    <rect width="120" height="60" class="hmi-panel" />
    <text x="60" y="25" class="hmi-label" text-anchor="middle">POSITION</text>
    <text id="valve_pos" x="60" y="50" class="hmi-value" text-anchor="middle">OPEN</text>
  </g>

  <!-- Flow Indicator -->
  <g id="flow-indicator" transform="translate(30, 110)">
    <rect width="120" height="60" class="hmi-panel" />
    <text x="60" y="25" class="hmi-label" text-anchor="middle">FLOW</text>
    <circle id="flow_light" cx="60" cy="48" r="12" class="indicator-on" />
  </g>

  <!-- Status Panel -->
  <g id="status-panel" transform="translate(30, 190)">
    <rect width="120" height="80" class="hmi-panel" />
    <text x="60" y="25" class="hmi-label" text-anchor="middle">STATUS</text>
    <circle id="status_light" cx="60" cy="52" r="14" class="indicator-on" />
    <text x="60" y="75" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">NORMAL</text>
  </g>

  <!-- Control Panel -->
  <g id="control-panel" transform="translate(30, 290)" class="interactive">
    <rect width="120" height="70" class="hmi-panel-glass" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" />
    <text x="60" y="25" class="hmi-label" text-anchor="middle">TOGGLE VALVE</text>
    <rect x="20" y="38" width="80" height="24" rx="12" fill="#334155" stroke="#64748b" stroke-width="2" />
    <circle id="toggle_ball" cx="50" cy="50" r="9" fill="#22c55e" />
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_valvePosition = 100;
    var _pb_valveOpen = true;
    var _pn_flowRate = 0.0;
    //!export-end

    function postValue(id, value) {
      console.log('FUXA post:', id, '=', value);
    }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_valvePosition':
          _pn_valvePosition = Math.max(0, Math.min(100, v));
          var gate = document.getElementById('valve_gate');
          var openWidth = (_pn_valvePosition / 100) * 90;
          gate.setAttribute('width', openWidth);
          gate.setAttribute('x', 155 + (90 - openWidth));
          if (_pn_valvePosition > 0) {
            document.getElementById('valve_pos').textContent = 'OPEN';
          } else {
            document.getElementById('valve_pos').textContent = 'CLOSED';
          }
          break;
        case '_pb_valveOpen':
          _pn_valveOpen = (v !== 0);
          var light = document.getElementById('flow_light');
          if (_pn_valveOpen) {
            light.setAttribute('class', 'indicator-on');
          } else {
            light.setAttribute('class', 'indicator-off');
          }
          break;
        case '_pn_flowRate':
          document.getElementById('valve_pos').textContent = v.toFixed(1) + ' L/min';
          break;
      }
    }

    // Click to toggle valve
    document.querySelector('[transform="translate(30, 290)"]').addEventListener('click', function() {
      var newVal = !_pn_valveOpen;
      postValue('_pb_valveOpen', newVal ? 1 : 0);
    });

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.removedNodes.forEach(function(node) {
          if (node.id === 'fuxa-industrial-valve') observer.disconnect();
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>
