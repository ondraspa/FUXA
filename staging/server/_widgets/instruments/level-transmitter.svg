function postValue(id,v){console.log('FUXA post:',id,'=',v);}
function putValue(id,v){v=Number(v);switch(id){case "_pn_level":document.getElementById("lt-level").setAttribute("height",v/100*58);var y=50-v/100*58;document.getElementById("lt-level").setAttribute("y",-48+y);break;}}

