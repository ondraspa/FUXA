<style>.b{fill:#dbeafe}.f{fill:url(#gs);stroke:#475569;stroke-width:1.5;rx:12;filter:url(#s)}.st{fill:url(#gs);stroke:#475569;stroke-width:1.5}.ir{fill:url(#gi);stroke:#334155;stroke-width:1.5}.cp{fill:url(#gc);stroke:#7f1d1d;stroke-width:1.5}.bl{fill:url(#gb);stroke:#075985;stroke-width:1.5}.tg{font:9px/1 sans-serif;fill:#64748b;text-anchor:middle;font-weight:600;letter-spacing:0.5px}
@keyframes ff{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}@keyframes fa{0%,100%{opacity:1}50%{opacity:0.2}}@keyframes fr{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
