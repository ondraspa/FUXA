<svg id="fuxa-level-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tube-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <radialGradient id="liquid-blue" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.95" />
    </radialGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <style>
      .tube-body { fill: url(#tube-metal); stroke: #475569; stroke-width: 2.5; }
      .tube-glass { fill: rgba(255, 255, 255, 0.15); stroke: none; }
      .level-mark { stroke: #64748b; stroke-width: 1.5; }
      .level-mark-major { stroke: #334155; stroke-width: 2; }
      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 20px; fill: #10b981; font-weight: bold; }
      .hmi-unit { font-family: sans-serif; font-size: 13px; fill: #64748b; }
      .hmi-setpoint { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
      .indicator-on { fill: #22c55e; filter: url(#glow-green); }
      .indicator-off { fill: #475569; }
      @keyframes alarm-flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .alarm-on { fill: #ef4444; animation: alarm-flash 1s infinite; }
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <rect width="400" height="500" fill="#f1f5f9" />

  <g id="mounting">
    <rect x="140" y="80" width="120" height="15" rx="4" class="tube-body" filter="url(#shadow-3d)" />
    <rect x="140" y="405" width="120" height="15" rx="4" class="tube-body" filter="url(#shadow-3d)" />
  </g>

  <g id="level-tube-group" filter="url(#shadow-3d)">
    <rect x="160" y="95" width="80" height="310" rx="10" class="tube-body" />
    <rect x="165" y="100" width="70" height="300" rx="8" class="tube-glass" />
    <rect id="liquid-body" x="167" y="250" width="66" height="148" fill="url(#liquid-blue)" rx="5" />
    <ellipse id="liquid-surface" cx="200" cy="250" rx="33" ry="8" fill="#93c5fd" opacity="0.7" />
    <line x1="240" y1="115" x2="255" y2="115" class="level-mark-major" />
    <line x1="240" y1="175" x2="250" y2="175" class="level-mark" />
    <line x1="240" y1="235" x2="250" y2="235" class="level-mark" />
    <line x1="240" y1="295" x2="250" y2="295" class="level-mark" />
    <line x1="240" y1="355" x2="255" y2="355" class="level-mark-major" />
    <text x="263" y="119" font-family="sans-serif" font-size="10" fill="#64748b">100%</text>
    <text x="263" y="239" font-family="sans-serif" font-size="10" fill="#64748b">50%</text>
    <text x="263" y="359" font-family="sans-serif" font-size="10" fill="#64748b">0%</text>
  </g>

  <g id="connections">
    <rect x="180" y="75" width="40" height="25" rx="3" class="tube-body" />
    <rect x="180" y="420" width="40" height="25" rx="3" class="tube-body" />
  </g>

  <g id="hmi-panels">
    <g transform="translate(20, 30)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">LEVEL</text>
      <text id="val_level" x="90" y="75" class="hmi-value" text-anchor="middle">52</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">%</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">VOLUME</text>
      <text id="val_volume" x="90" y="75" class="hmi-value" text-anchor="middle">12.4</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">m3</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="180" height="90" class="hmi-panel" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">STATUS</text>
      <circle id="status_light" cx="90" cy="65" r="14" class="indicator-on" />
    </g>

    <g transform="translate(20, 360)" class="interactive">
      <rect width="180" height="90" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">LEVEL SETPOINT</text>
      <rect x="30" y="50" width="120" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text id="set_level" x="90" y="76" class="hmi-setpoint" text-anchor="middle">50</text>
    </g>

    <g transform="translate(240, 30)" class="interactive">
      <rect width="140" height="250" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="70" y="35" class="hmi-label" text-anchor="middle">ALARM SETPOINTS</text>
      <rect x="20" y="60" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="82" class="hmi-label" text-anchor="middle">HIGH ALARM</text>
      <text id="alarm_high" x="70" y="105" class="hmi-setpoint" text-anchor="middle">90</text>
      <rect x="20" y="125" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="147" class="hmi-label" text-anchor="middle">LOW ALARM</text>
      <text id="alarm_low" x="70" y="170" class="hmi-setpoint" text-anchor="middle">10</text>
      <rect x="20" y="195" width="100" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
      <text x="70" y="221" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">RESET ALARMS</text>
    </g>
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_level = 52.0;
    var _pn_volume = 12.4;
    var _pb_alarmActive = false;
    var _pn_setLevel = 50.0;
    var _pn_alarmHigh = 90.0;
    var _pn_alarmLow = 10.0;
    //!export-end

    function postValue(id, value) { console.log('FUXA post:', id, '=', value); }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_level':
          _pn_level = Math.max(0, Math.min(100, v));
          var h = (_pn_level / 100) * 148;
          var y = 398 - h;
          document.getElementById('liquid-body').setAttribute('height', h);
          document.getElementById('liquid-body').setAttribute('y', y + 5);
          document.getElementById('liquid-surface').setAttribute('cy', y);
          document.getElementById('val_level').textContent = Math.round(_pn_level);
          break;
        case '_pn_volume':
          document.getElementById('val_volume').textContent = v.toFixed(1);
          break;
        case '_pb_alarmActive':
          var light = document.getElementById('status_light');
          if (v !== 0) { light.setAttribute('class', 'alarm-on'); } else { light.setAttribute('class', 'indicator-on'); }
          break;
        case '_pn_setLevel':
          document.getElementById('set_level').textContent = Math.round(v);
          break;
        case '_pn_alarmHigh':
          document.getElementById('alarm_high').textContent = Math.round(v);
          break;
        case '_pn_alarmLow':
          document.getElementById('alarm_low').textContent = Math.round(v);
          break;
      }
    }

    document.querySelector('[transform="translate(20, 360)"]').addEventListener('click', function() {
      var newVal = prompt('Set level (0-100%):', _pn_level);
      if (newVal !== null &amp;&amp; !isNaN(newVal)) { postValue('_pn_level', Number(newVal)); }
    });

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.removedNodes.forEach(function(node) { if (node.id === 'fuxa-level-indicator') observer.disconnect(); });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>