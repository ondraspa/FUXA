<svg id="fuxa-pressure-gauge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Industrial 3D Gradients -->
    <linearGradient id="gauge-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="gauge-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <radialGradient id="gauge-center" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <style>
      .gauge-body { fill: url(#gauge-metal); stroke: #475569; stroke-width: 2.5; }
      .gauge-face { fill: url(#gauge-face); stroke: #cbd5e1; stroke-width: 1.5; }
      .gauge-needle { fill: url(#needle-grad); stroke: #991b1b; stroke-width: 1.5; }
      .gauge-center { fill: url(#gauge-center); stroke: #475569; stroke-width: 2; }
      
      .tick-major { stroke: #1e293b; stroke-width: 2.5; }
      .tick-minor { stroke: #64748b; stroke-width: 1.5; }
      .scale-text { font-family: sans-serif; font-size: 12px; fill: #475569; font-weight: 600; }
      .scale-unit { font-family: sans-serif; font-size: 14px; fill: #64748b; }
      
      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 20px; fill: #10b981; font-weight: bold; }
      .hmi-setpoint { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
      
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f1f5f9" />

  <!-- Gauge Shadow -->
  <ellipse cx="200" cy="340" rx="95" ry="12" fill="#0f172a" opacity="0.2" filter="url(#shadow-3d)" />

  <!-- Gauge Body -->
  <g id="gauge-body-group" filter="url(#shadow-3d)">
    <!-- Outer ring -->
    <circle cx="200" cy="240" r="115" class="gauge-body" />
    <circle cx="200" cy="240" r="105" class="gauge-face" />
    
    <!-- Scale marks -->
    <g id="scale-marks">
      <!-- Major ticks (0, 25, 50, 75, 100) -->
      <line x1="200" y1="140" x2="200" y2="165" class="tick-major" transform="rotate(-90 200 240)" />
      <line x1="200" y1="140" x2="200" y2="165" class="tick-major" transform="rotate(-45 200 240)" />
      <line x1="200" y1="140" x2="200" y2="165" class="tick-major" transform="rotate(0 200 240)" />
      <line x1="200" y1="140" x2="200" y2="165" class="tick-major" transform="rotate(45 200 240)" />
      <line x1="200" y1="140" x2="200" y2="165" class="tick-major" transform="rotate(90 200 240)" />
      
      <!-- Minor ticks -->
      <line x1="200" y1="145" x2="200" y2="160" class="tick-minor" transform="rotate(-67.5 200 240)" />
      <line x1="200" y1="145" x2="200" y2="160" class="tick-minor" transform="rotate(-22.5 200 240)" />
      <line x1="200" y1="145" x2="200" y2="160" class="tick-minor" transform="rotate(22.5 200 240)" />
      <line x1="200" y1="145" x2="200" y2="160" class="tick-minor" transform="rotate(67.5 200 240)" />
    </g>
    
    <!-- Scale values -->
    <text x="130" y="145" class="scale-text" text-anchor="middle" transform="rotate(-90 200 240)">0</text>
    <text x="155" y="240" class="scale-text" text-anchor="middle" transform="rotate(-45 200 240)">25</text>
    <text x="200" y="130" class="scale-text" text-anchor="middle">50</text>
    <text x="245" y="240" class="scale-text" text-anchor="middle" transform="rotate(45 200 240)">75</text>
    <text x="270" y="345" class="scale-text" text-anchor="middle" transform="rotate(90 200 240)">100</text>
    
    <!-- Unit -->
    <text x="200" y="285" class="scale-unit" text-anchor="middle">bar</text>
    
    <!-- Needle -->
    <g id="needle-group">
      <polygon points="200,240 193,155 200,148 207,155" class="gauge-needle" />
      <circle cx="200" cy="240" r="18" class="gauge-center" />
      <circle cx="200" cy="240" r="8" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    </g>
  </g>

  <!-- Process Connection -->
  <g id="process-connection">
    <rect x="180" y="355" width="40" height="25" rx="4" class="gauge-body" />
    <rect x="170" y="375" width="60" height="20" rx="4" class="gauge-body" />
    <circle cx="200" cy="395" r="8" fill="#475569" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Glass Cover Highlight -->
  <path d="M120 200 Q200 165 280 200" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35" />

  <!-- HMI Panels -->
  <g id="hmi-panels">
    <!-- Digital Readout -->
    <g transform="translate(20, 30)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">PRESSURE</text>
      <text id="val_pressure" x="90" y="75" class="hmi-value" text-anchor="middle">3.8</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">bar</text>
    </g>

    <!-- Setpoint Panel -->
    <g transform="translate(20, 140)" class="interactive">
      <rect width="180" height="90" class="hmi-panel-glass" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">ALARM SETPOINT</text>
      <text id="set_pressure" x="90" y="75" class="hmi-setpoint" text-anchor="middle">4.0</text>
    </g>

    <!-- Status Panel -->
    <g transform="translate(20, 250)">
      <rect width="180" height="90" class="hmi-panel" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">STATUS</text>
      <circle id="status_light" cx="90" cy="65" r="14" class="indicator-on" />
    </g>

    <!-- Min/Max Panel -->
    <g transform="translate(20, 360)">
      <rect width="180" height="90" class="hmi-panel" />
      <text x="90" y="30" class="hmi-label" text-anchor="middle">MIN/MAX</text>
      <text id="min_val" x="60" y="65" class="hmi-value" text-anchor="middle">1.2</text>
      <text x="120" y="65" class="hmi-value" text-anchor="middle">4.9</text>
      <text x="60" y="85" class="hmi-unit" text-anchor="middle">MIN</text>
      <text x="120" y="85" class="hmi-unit" text-anchor="middle">MAX</text>
    </g>

    <!-- Click to Set -->
    <g transform="translate(240, 30)" class="interactive">
      <rect width="140" height="250" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="70" y="35" class="hmi-label" text-anchor="middle">SET PRESSURE</text>
      <rect x="20" y="60" width="100" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="92" class="hmi-setpoint" text-anchor="middle">3.8</text>
      <rect x="20" y="140" width="50" height="35" rx="6" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
      <text x="45" y="162" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">SET</text>
      <rect x="70" y="140" width="50" height="35" rx="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />
      <text x="95" y="162" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">RESET</text>
    </g>
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_pressure = 3.8;
    var _pb_alarmActive = false;
    var _pn_setPressure = 4.0;
    var _pn_pressureMin = 1.2;
    var _pn_pressureMax = 4.9;
    //!export-end

    function postValue(id, value) {
      console.log('FUXA post:', id, '=', value);
    }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_pressure':
          _pn_pressure = Math.max(0, Math.min(100, v));
          var angle = (_pn_pressure / 100) * 180 - 90;
          var needle = document.getElementById('needle-group');
          needle.setAttribute('transform', 'rotate(' + angle + ' 200 240)');
          document.getElementById('val_pressure').textContent = v.toFixed(1);
          break;
        case '_pb_alarmActive':
          _pn_valveOpen = (v !== 0);
          var light = document.getElementById('status_light');
          if (_pn_valveOpen) {
            light.setAttribute('class', 'alarm-on');
          } else {
            light.setAttribute('class', 'indicator-on');
          }
          break;
        case '_pn_setPressure':
          _pn_valveOpen = v;
          document.getElementById('set_pressure').textContent = v.toFixed(1);
          break;
        case '_pn_pressureMin':
          _pn_valveOpen = v;
          document.getElementById('min_val').textContent = v.toFixed(1);
          break;
        case '_pn_pressureMax':
          _pn_valveOpen = v;
          document.querySelector('[transform="translate(20, 360)"] .hmi-value:nth-child(2)').textContent = v.toFixed(1);
          break;
      }
    }

    // Click to set pressure
    document.querySelector('[transform="translate(240, 30)"]').addEventListener('click', function() {
      var newVal = prompt('Set pressure (0-100 bar):', _pn_pressure);
      if (newVal !== null &amp;&amp; !isNaN(newVal)) {
        postValue('_pn_pressure', Number(newVal));
      }
    });

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.removedNodes.forEach(function(node) {
          if (node.id === 'fuxa-pressure-gauge') observer.disconnect();
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>
