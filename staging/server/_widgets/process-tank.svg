<svg id="fuxa-process-tank" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Industrial 3D Gradients -->
    <linearGradient id="tank-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="15%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="tank-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <radialGradient id="liquid-round" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.95" />
    </radialGradient>

    <linearGradient id="liquid-surface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>

    <filter id="inner-shadow">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="4" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#0f172a" flood-opacity="0.25" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>

    <style>
      .tank-body { fill: url(#tank-metal); stroke: #475569; stroke-width: 2.5; }
      .tank-liquid { transition: height 0.5s, y 0.5s; }
      .tank-glass { fill: rgba(255, 255, 255, 0.15); stroke: none; }
      
      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 20px; fill: #10b981; font-weight: bold; }
      .hmi-unit { font-family: sans-serif; font-size: 13px; fill: #64748b; }
      .hmi-setpoint { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
      
      .level-mark { stroke: #64748b; stroke-width: 1.5; }
      .level-mark-major { stroke: #334155; stroke-width: 2; }
      
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f1f5f9" />

  <!-- Tank Shadow -->
  <ellipse cx="200" cy="430" rx="110" ry="15" fill="#0f172a" opacity="0.2" filter="url(#shadow-3d)" />

  <!-- Tank Structure -->
  <g id="tank-structure" filter="url(#shadow-3d)">
    <!-- Tank body -->
    <rect x="100" y="80" width="200" height="320" rx="15" class="tank-body" />
    
    <!-- Glass window -->
    <rect x="105" y="85" width="190" height="310" rx="12" class="tank-glass" filter="url(#inner-shadow)" />
    
    <!-- Liquid -->
    <rect id="liquid-body" x="107" y="240" width="186" height="153" class="tank-liquid" fill="url(#liquid-round)" rx="8" />
    
    <!-- Liquid surface highlight -->
    <ellipse id="liquid-surface" cx="200" cy="240" rx="93" ry="12" fill="url(#liquid-surface)" opacity="0.7" />
    
    <!-- Level marks -->
    <line x1="295" y1="100" x2="310" y2="100" class="level-mark-major" />
    <line x1="295" y1="160" x2="305" y2="160" class="level-mark" />
    <line x1="295" y1="220" x2="305" y2="220" class="level-mark" />
    <line x1="295" y1="280" x2="305" y2="280" class="level-mark" />
    <line x1="295" y1="340" x2="305" y2="340" class="level-mark" />
    <line x1="295" y1="380" x2="310" y2="380" class="level-mark-major" />
    
    <!-- Level labels -->
    <text x="318" y="104" font-family="sans-serif" font-size="10" fill="#64748b">100%</text>
    <text x="318" y="224" font-family="sans-serif" font-size="10" fill="#64748b">50%</text>
    <text x="318" y="384" font-family="sans-serif" font-size="10" fill="#64748b">0%</text>
  </g>

  <!-- Tank Top -->
  <g id="tank-top">
    <path d="M100 80 Q200 40 300 80" class="tank-body" />
    <!-- Manway -->
    <circle cx="200" cy="65" r="18" class="tank-body" />
    <circle cx="200" cy="65" r="12" fill="#475569" stroke="#334155" stroke-width="2" />
    <line x1="190" y1="65" x2="210" y2="65" stroke="#f8fafc" stroke-width="3" />
    <line x1="200" y1="55" x2="200" y2="75" stroke="#f8fafc" stroke-width="3" />
  </g>

  <!-- Agitator Motor -->
  <g id="agitator">
    <rect x="175" y="30" width="50" height="25" rx="4" class="tank-body" />
    <rect x="180" y="25" width="40" height="8" rx="3" fill="#64748b" />
    <circle cx="200" cy="20" r="14" class="tank-body" />
    <line id="agitator-shaft" x1="200" y1="35" x2="200" y2="80" stroke="#94a3b8" stroke-width="6" />
  </g>

  <!-- Inlet Pipe -->
  <g id="inlet-pipe">
    <rect x="320" y="100" width="60" height="24" rx="3" class="tank-body" />
    <circle cx="380" cy="112" r="16" class="tank-body" />
    <circle cx="380" cy="112" r="6" fill="#475569" />
    <text x="380" y="145" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">INLET</text>
  </g>

  <!-- Outlet Pipe -->
  <g id="outlet-pipe">
    <rect x="320" y="360" width="60" height="24" rx="3" class="tank-body" />
    <circle cx="380" cy="372" r="16" class="tank-body" />
    <circle cx="380" cy="372" r="6" fill="#475569" />
    <text x="380" y="405" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">OUTLET</text>
  </g>

  <!-- Sight Glass -->
  <g id="sight-glass">
    <rect x="120" y="180" width="35" height="140" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" filter="url(#inner-shadow)" />
    <rect id="sight-liquid" x="123" y="240" width="29" height="77" fill="url(#liquid-surface)" opacity="0.8" rx="3" />
  </g>

  <!-- HMI Panels -->
  <g id="hmi-panels">
    <!-- Level Panel -->
    <g transform="translate(20, 30)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
      <rect width="180" height="100" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">TANK LEVEL</text>
      <text id="val_level" x="90" y="75" class="hmi-value" text-anchor="middle">52</text>
      <text x="90" y="92" class="hmi-unit" text-anchor="middle">%</text>
    </g>

    <!-- Temperature Panel -->
    <g transform="translate(20, 150)">
      <rect width="180" height="100" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">TEMPERATURE</text>
      <text id="val_temp" x="90" y="75" class="hmi-value" text-anchor="middle">68.5</text>
      <text x="90" y="92" class="hmi-unit" text-anchor="middle">°C</text>
    </g>

    <!-- Pressure Panel -->
    <g transform="translate(20, 270)">
      <rect width="180" height="100" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">PRESSURE</text>
      <text id="val_pressure" x="90" y="75" class="hmi-value" text-anchor="middle">1.2</text>
      <text x="90" y="92" class="hmi-unit" text-anchor="middle">bar</text>
    </g>

    <!-- Volume Panel -->
    <g transform="translate(20, 390)">
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">VOLUME</text>
      <text id="val_volume" x="90" y="75" class="hmi-value" text-anchor="middle">12.4</text>
      <text x="90" y="92" class="hmi-unit" text-anchor="middle">m³</text>
    </g>

    <!-- Agitator Control -->
    <g transform="translate(240, 30)" class="interactive">
      <rect width="140" height="150" class="hmi-panel" />
      <rect width="140" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="70" y="42" class="hmi-label" text-anchor="middle">AGITATOR</text>
      <circle id="agitator_light" cx="70" cy="85" r="14" class="indicator-on" />
      <text x="70" y="125" class="hmi-value" text-anchor="middle">ON</text>
      <circle cx="70" cy="145" r="30" fill="none" stroke="#64748b" stroke-width="2" id="agitator-ring" />
    </g>
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_tankLevel = 52.0;
    var _pn_tankTemp = 68.5;
    var _pn_tankPressure = 1.2;
    var _pn_tankVolume = 12.4;
    var _pb_agitatorOn = true;
    var _pc_liquidColor = '#3b82f6';
    //!export-end

    var agitatorAngle = 0;
    var animFrame;

    function postValue(id, value) {
      console.log('FUXA post:', id, '=', value);
    }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_tankLevel':
          _pn_tankLevel = Math.max(0, Math.min(100, v));
          var h = (_pn_tankLevel / 100) * 153;
          var y = 393 - h;
          document.getElementById('liquid-body').setAttribute('height', h);
          document.getElementById('liquid-body').setAttribute('y', y + 12);
          document.getElementById('liquid-surface').setAttribute('cy', y);
          document.getElementById('sight-liquid').setAttribute('height', h * 0.5);
          document.getElementById('sight-liquid').setAttribute('y', y + 60);
          document.getElementById('val_level').textContent = Math.round(_pn_tankLevel);
          break;
        case '_pn_tankTemp':
          _pn_tankTemp = v;
          document.getElementById('val_temp').textContent = v.toFixed(1);
          break;
        case '_pn_tankPressure':
          _pn_tankPressure = v;
          document.getElementById('val_pressure').textContent = v.toFixed(1);
          break;
        case '_pn_tankVolume':
          _pn_tankVolume = v;
          document.getElementById('val_volume').textContent = v.toFixed(1);
          break;
        case '_pb_agitatorOn':
          _pn_valveOpen = (v !== 0);
          var light = document.getElementById('agitator_light');
          if (_pn_valveOpen) {
            light.setAttribute('class', 'indicator-on');
            document.querySelector('#hmi-panels [transform="translate(240, 30)"] .hmi-value').textContent = 'ON';
          } else {
            light.setAttribute('class', 'indicator-off');
            document.querySelector('#hmi-panels [transform="translate(240, 30)"] .hmi-value').textContent = 'OFF';
          }
          break;
      }
    }

    function animate() {
      if (_pn_valveOpen) {
        agitatorAngle = (agitatorAngle + 3) % 360;
        var shaft = document.getElementById('agitator-shaft');
        var endX = 200 + Math.cos(agitatorAngle * Math.PI / 180) * 15;
        var endY = 35 + Math.sin(agitatorAngle * Math.PI / 180) * 15;
        shaft.setAttribute('x2', endX);
        shaft.setAttribute('y2', endY);
      }
      animFrame = requestAnimationFrame(animate);
    }
    animFrame = requestAnimationFrame(animate);

    // Click to toggle agitator
    document.querySelector('[transform="translate(240, 30)"]').addEventListener('click', function() {
      var newVal = !_pn_valveOpen;
      postValue('_pb_agitatorOn', newVal ? 1 : 0);
    });

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        mutation.removedNodes.forEach(function(node) {
          if (node.id === 'fuxa-process-tank') {
            cancelAnimationFrame(animFrame);
            observer.disconnect();
          }
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>
