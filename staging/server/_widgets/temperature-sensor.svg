<svg id="fuxa-temperature-sensor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sensor-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <radialGradient id="temp-hot" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <radialGradient id="temp-cold" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <filter id="shadow-3d" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <style>
      .sensor-body { fill: url(#sensor-metal); stroke: #475569; stroke-width: 2.5; }
      .sensor-head { fill: url(#temp-hot); stroke: #7f1d1d; stroke-width: 2; }
      .hmi-panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 8; filter: url(#shadow-3d); }
      .hmi-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; }
      .hmi-value { font-family: 'Consolas', monospace; font-size: 20px; fill: #10b981; font-weight: bold; }
      .hmi-unit { font-family: sans-serif; font-size: 13px; fill: #64748b; }
      .hmi-setpoint { font-family: monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
      .indicator-on { fill: #22c55e; filter: url(#glow-green); }
      .indicator-off { fill: #475569; }
      @keyframes alarm-flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .alarm-on { fill: #ef4444; animation: alarm-flash 1s infinite; }
      .interactive:hover { filter: url(#shadow-3d) brightness(1.15); cursor: pointer; }
    </style>
  </defs>

  <rect width="400" height="500" fill="#f1f5f9" />

  <g id="sensor-group" filter="url(#shadow-3d)">
    <!-- Sensor probe -->
    <rect x="185" y="100" width="30" height="250" rx="4" class="sensor-body" />
    <!-- Sensor head -->
    <circle cx="200" cy="85" r="35" class="sensor-head" />
    <circle cx="200" cy="85" r="25" fill="#475569" stroke="#334155" stroke-width="2" />
    <text x="200" y="90" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle">TEMP</text>
    <!-- Sensor tip -->
    <path d="M185 350 L200 370 L215 350" class="sensor-body" />
    <!-- Cable -->
    <path d="M200 120 Q250 60 300 80" fill="none" stroke="#475569" stroke-width="4" />
    <circle cx="300" cy="80" r="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
  </g>

  <g id="hmi-panels">
    <g transform="translate(20, 30)">
    <circle cx="-155" cy="0" r="0" data-port-id="in" data-port-dir="left" data-port-type="pipe"/><circle cx="155" cy="0" r="0" data-port-id="out" data-port-dir="right" data-port-type="pipe"/>
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">TEMPERATURE</text>
      <text id="val_temp" x="90" y="75" class="hmi-value" text-anchor="middle">68.5</text>
      <text x="90" y="88" class="hmi-unit" text-anchor="middle">C</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="180" height="90" class="hmi-panel" />
      <rect width="180" height="22" rx="6" fill="#ffffff" opacity="0.1" />
      <text x="15" y="42" class="hmi-label">HEATER STATUS</text>
      <circle id="status_light" cx="90" cy="65" r="14" class="indicator-on" />
    </g>

    <g transform="translate(20, 250)" class="interactive">
      <rect width="180" height="90" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="90" y="35" class="hmi-label" text-anchor="middle">TEMP SETPOINT</text>
      <rect x="30" y="50" width="120" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text id="set_temp" x="90" y="76" class="hmi-setpoint" text-anchor="middle">70.0</text>
    </g>

    <g transform="translate(240, 30)" class="interactive">
      <rect width="140" height="250" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8" filter="url(#shadow-3d)" />
      <text x="70" y="35" class="hmi-label" text-anchor="middle">ALARM SETPOINTS</text>
      <rect x="20" y="60" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="82" class="hmi-label" text-anchor="middle">HIGH ALARM</text>
      <text id="alarm_high" x="70" y="105" class="hmi-setpoint" text-anchor="middle">80.0</text>
      <rect x="20" y="125" width="100" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="147" class="hmi-label" text-anchor="middle">LOW ALARM</text>
      <text id="alarm_low" x="70" y="170" class="hmi-setpoint" text-anchor="middle">50.0</text>
      <rect x="20" y="195" width="100" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="2" />
      <text x="70" y="221" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">RESET ALARMS</text>
    </g>
  </g>

  <script>
    <![CDATA[
    //!export-start
    var _pn_temp = 68.5;
    var _pb_heaterOn = true;
    var _pn_setTemp = 70.0;
    var _pn_alarmHigh = 80.0;
    var _pn_alarmLow = 50.0;
    //!export-end

    function postValue(id, value) { console.log('FUXA post:', id, '=', value); }

    function putValue(id, value) {
      var v = Number(value);
      switch(id) {
        case '_pn_temp':
          _pn_valveOpen = v;
          document.getElementById('val_temp').textContent = v.toFixed(1);
          break;
        case '_pb_heaterOn':
          var light = document.getElementById('status_light');
          if (v !== 0) { light.setAttribute('class', 'indicator-on'); } else { light.setAttribute('class', 'indicator-off'); }
          break;
        case '_pn_setTemp':
          document.getElementById('set_temp').textContent = v.toFixed(1);
          break;
        case '_pn_alarmHigh':
          document.getElementById('alarm_high').textContent = v.toFixed(1);
          break;
        case '_pn_alarmLow':
          document.getElementById('alarm_low').textContent = v.toFixed(1);
          break;
      }
    }

    document.querySelector('[transform="translate(20, 250)"]').addEventListener('click', function() {
      var newVal = prompt('Set temperature:', _pn_setTemp);
      if (newVal !== null &amp;&amp; !isNaN(newVal)) { postValue('_pn_setTemp', Number(newVal)); }
    });

    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) { mutation.removedNodes.forEach(function(node) { if (node.id === 'fuxa-temperature-sensor') observer.disconnect(); }); });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    ]]>
  </script>
</svg>